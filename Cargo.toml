# Frontier Template
quantumharmony-runtime = { path = "runtime", default-features = false }
jsonrpsee-ws-client = { version = '0.22.5' }

trie-db = { git = "https://github.com/paritytech/trie", default-features = false }
sp-application-crypto = { git = "https://github.com/Paraxiom/polkadot-sdk-pq", rev = "63acf00ce88cf62a67aeb769546fd94d4157dbac", default-features = false }

dashmap = "4.0"
hashbrown = "0.9.1"

getrandom = { version = "0.2", default-features = false, features = ["js"] }


[profile.release]
# Substrate runtime requires unwinding.
panic = "unwind"

[profile.production]
inherits = "release"
# Sacrifice compile speed for execution speed by using optimization flags:
# https://doc.rust-lang.org/rustc/linker-plugin-lto.html
lto = true
# https://doc.rust-lang.org/rustc/codegen-options/index.html#codegen-units
codegen-units = 1

[patch.crates-io]
parity-scale-codec = { git = "https://github.com/Paraxiom/parity-scale-codec", rev = "46c1205ae009ba9049ff55decc3923c58b7873c4" }
parity-scale-codec-derive = { git = "https://github.com/Paraxiom/parity-scale-codec", rev = "46c1205ae009ba9049ff55decc3923c58b7873c4" }


