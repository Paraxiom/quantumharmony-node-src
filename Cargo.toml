[workspace]
members = [
	"node",
	"runtime",

	# Stage-0 governance signature verifier (standalone binary)
	"crates/qh-falcon-verify",

	"pallets/substrate-validator-set",
	"pallets/pallet-onboarding-commit",
	"pallets/pallet-credential-vault",
	"pallets/pallet-substrate-attestation",
	"pallets/pallet-reputation-tokens",
	"pallets/pallet-thin-slasher",
	"pallets/validator-governance",
	"pallets/qkd-client",
	"pallets/runtime-segmentation",
	"pallets/validator-entropy",
	"pallets/pallet-coherence-attestation",
	"pallets/relay-coordination",
	"pallets/dev-governance",
	"pallets/ricardian-contracts",
	"pallets/notarial",
	"pallets/axiom-attestation",
	"pallets/drista",
	"pallets/mesh-forum",
	"pallets/oracle",
	"pallets/oracle-feeds",
	"pallets/devonomics",
	"pallets/topological-coherence",
	"pallets/transparence-oracle",
	"pallets/transparence-twomanrule",
	"pallets/transparence-deliverables",
	"pallets/identity-registry",
	"crates/topological-coherence",
	"tools/runtime-upgrade",
	# "wallet", # Temporarily excluded - missing warp dependency
	# quantum-crypto and proof-of-coherence are in Paraxiom/polkadot-sdk fork

]
# Not part of the build: pins paritytech release-polkadot-v1.1.0 (2023) and would
# drag a second sp-core and secp256k1 (C) into the lockfile. Not in the runtime.
exclude = [
	"pallets/pedersen-commitment",
	# Do not build with this lockfile: pq-triple-ratchet needs ml-kem 0.2
	# (kem 0.3.0-pre.0) while paraxiom-pqc needs ml-kem 0.3 (kem 0.3.0),
	# and cargo allows one kem 0.3. node-operator depends on it.
	"crates/pq-triple-ratchet",
	"node-operator",
]
resolver = "2"

[workspace.package]
authors = ["Paraxiom"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Paraxiom/quantumharmony"

[workspace.dependencies]
qkd-client = { path = "pallets/qkd-client", default-features = false }
topological-coherence = { path = "crates/topological-coherence", default-features = false, features = ["substrate"] }
async-trait = { version = "0.1", default-features = false }
bn = { package = "substrate-bn", version = "0.6", default-features = false }
clap = { version = "4.5", default-features = false, features = ["derive", "deprecated"] }
derive_more = { version = "0.99", default-features = false }
environmental = { version = "1.1.4", default-features = false }
ethereum = { version = "0.15.0", default-features = false }
ethereum-types = { version = "0.14.1", default-features = false }
evm = { version = "0.41.1", default-features = false }
futures = { version = "0.3.30", default-features = false }
hash-db = { version = "0.16.0", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = { version = "0.4.1", default-features = false }
impl-serde = { version = "0.4.0", default-features = false }
impl-trait-for-tuples = { version = "0.2.1", default-features = false }
jsonrpsee = { version = "0.24.9", default-features = false }
jsonrpsee-types = { version = "0.24.9", default-features = false }
jsonrpsee-core = { version = "0.24.9", default-features = false }
