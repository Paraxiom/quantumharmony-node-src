version: '3.8'

# QuantumHarmony Local 3-Validator Testnet
#
# PQC Transport (Kyber-1024 + Falcon-1024):
#   All P2P connections use post-quantum cryptographic transport by default
#   (pqc-transport feature is enabled in the build). PQC identities are
#   auto-generated on first run and persisted in each node's data volume.
#
#   Peer discovery uses mDNS on the docker bridge network — no hardcoded
#   node-keys or bootnodes required. Each node generates a unique libp2p
#   identity on first start, persisted in its data volume.
#
#   To inject pre-generated PQC identities for stable PQC PeerIds:
#     PQC_IDENTITY_KEY: '{"falcon_public_key":"0x...","falcon_secret_key":"0x..."}'
#
#   For stable node-keys (e.g. CI), generate unique keys:
#     scripts/generate-node-keys.sh

services:
  alice:
    image: quantumharmony:latest
    build:
      context: ..
      dockerfile: quantumharmony/Dockerfile.multinode
    container_name: quantumharmony-alice
    hostname: alice
    ports:
      - "9944:9944"
      - "30333:30333"
    volumes:
      - alice-data:/data
    command: >
      --chain=local
      --alice
      --validator
      --base-path=/data
      --unsafe-rpc-external
      --rpc-cors=all
      --rpc-methods=safe
      --unsafe-ws-external
      --port=30333
      --rpc-port=9944
    networks:
      quantum-net:
        ipv4_address: 172.20.0.10
    environment:
      - RUST_LOG=info,coherence=debug

  bob:
    image: quantumharmony:latest
    build:
      context: ..
      dockerfile: quantumharmony/Dockerfile.multinode
    container_name: quantumharmony-bob
    hostname: bob
    ports:
      - "9945:9944"
      - "30334:30333"
    volumes:
      - bob-data:/data
    command: >
      --chain=local
      --bob
      --validator
      --base-path=/data
      --unsafe-rpc-external
      --rpc-cors=all
      --rpc-methods=safe
      --unsafe-ws-external
      --port=30333
      --rpc-port=9944
    networks:
      quantum-net:
        ipv4_address: 172.20.0.11
    environment:
      - RUST_LOG=info,coherence=debug
    depends_on:
      - alice

  charlie:
    image: quantumharmony:latest
    build:
      context: ..
      dockerfile: quantumharmony/Dockerfile.multinode
    container_name: quantumharmony-charlie
    hostname: charlie
    ports:
      - "9946:9944"
      - "30335:30333"
    volumes:
      - charlie-data:/data
    command: >
      --chain=local
      --charlie
      --validator
      --base-path=/data
      --unsafe-rpc-external
      --rpc-cors=all
      --rpc-methods=safe
      --unsafe-ws-external
      --port=30333
      --rpc-port=9944
    networks:
      quantum-net:
        ipv4_address: 172.20.0.12
    environment:
      - RUST_LOG=info,coherence=debug
    depends_on:
      - alice

volumes:
  alice-data:
  bob-data:
  charlie-data:

networks:
  quantum-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
