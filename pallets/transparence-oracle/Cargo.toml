[package]
name = "pallet-transparence-oracle"
version = "1.0.0"
description = "Oracle validation anchoring for Transparence governance platform"
authors = ["Paraxiom Technologies Inc."]
homepage = "https://paraxiom.org"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Paraxiom/quantumharmony"

[dependencies]
codec = { package = "parity-scale-codec", workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
log = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true }
sp-io = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-std/std",
    "sp-runtime/std",
]
try-runtime = ["frame-support/try-runtime"]
