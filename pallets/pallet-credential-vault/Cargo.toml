[package]
name = "pallet-credential-vault"
version = "0.1.0"
description = "On-chain commitments to IPFS-resident encrypted credentials. Realizes Theorem 11 (crypto-shredding completeness) from the Identity as Accountability Chain treatise. Closes the structural key-loss class observed in the 2026-05-28 incident (QH#33)."
authors = ["Paraxiom Technologies Inc."]
homepage = "https://paraxiom.org"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Paraxiom/quantumharmony"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
log = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-io/std",
]
runtime-benchmarks = ["frame-support/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]
