[package]
name = "quantumharmony-runtime-upgrade"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# RPC and networking
jsonrpsee = { version = "0.24.5", features = ["client", "ws-client"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }

# Utilities
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[[bin]]
name = "runtime-upgrade"
path = "src/main.rs"
